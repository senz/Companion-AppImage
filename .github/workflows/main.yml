name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:
    inputs:
      companion_version:
        description: 'Companion version to build'
        required: false
        type: string
      build_archs:
        description: 'Architectures to build (space-separated)'
        required: false
        type: string
    
jobs:
  build-and-release:
    runs-on: ubuntu-20.04
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      COMPANION_VERSION: ${{ inputs.companion_version || '4.0.1+8061-stable-b1c1c1f4dd' }}
      BUILD_ARCHS: ${{ inputs.build_archs || 'arm64 x86_64' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Run Build Script
      run: sh ./build.sh

    - name: Create and Push Tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        TAG_NAME="companion-${COMPANION_VERSION}-${{ github.run_number }}"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
        git tag $TAG_NAME $GITHUB_SHA
        git push origin $TAG_NAME

    - name: Upload AppImage to Release
      uses: meeDamian/github-release@2.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ env.TAG_NAME }}
        files: "Bitfocus_Companion*.AppImage"
        gzip: false
        allow_override: true
